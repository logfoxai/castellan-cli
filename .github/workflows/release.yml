name: Release
on:
  push:
    branches: [main, next]
  workflow_dispatch:
permissions:
  id-token: write   # Required for npm trusted publishing (OIDC)
  contents: write   # Required for autorel to push release tag
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{github.ref}}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # npm 11+ required for trusted publishing (OIDC)
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      # Check-only gates (no --fix); `npm run validate` is the local fix+verify.
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      # Publishes via npm Trusted Publisher (OIDC). No NPM_TOKEN.
      # First-time bootstrap (package must exist on npm first): see README § Publishing.
      - run: npx autorel@^2
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
