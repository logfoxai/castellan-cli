name: PR Check
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
        timeout-minutes: 3
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
